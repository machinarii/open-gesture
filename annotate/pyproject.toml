[project]
name = "open-gesture-annotate"
version = "0.1.0"
description = "Multimodal annotation pipeline for the Open Gesture dataset"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
face      = ["uniface[cpu]>=4.0.0"]
aus       = ["py-feat>=0.6"]
va        = ["hsemotion>=0.3"]
# mediapipe 1.0.0/1.0.1 aborts on macOS/arm64 with "Check failed: service_ Service
# is unavailable" inside TensorsToDetectionsCalculator's Metal helper when creating
# a HandLandmarker via the Tasks API -- a native crash unrelated to this project's
# code (Task 10, 2026-08-25). Pinned below 1.0 until that regression is fixed
# upstream; mediapipe 0.10.35 creates both landmarkers cleanly on CPU.
#
# mediapipe also declares opencv-contrib-python as a dependency, which installs
# into the same `cv2/` package directory as this project's own opencv-python
# dependency (150+ overlapping files) and silently overwrites it. The two
# distributions are not meant to coexist; having both installed caused a
# `libc++abi ... recursive_mutex lock failed` abort at interpreter shutdown
# during the full test run (Task 10, 2026-08-25), unrelated to any single test's
# pass/fail. After installing this extra, run:
#     pip uninstall -y opencv-contrib-python opencv-python
#     pip install --force-reinstall --no-deps "opencv-python>=4.8"
# to leave only opencv-python's files in place. `pip check` will then report
# mediapipe's opencv-contrib-python requirement as unmet -- that is expected and
# safe to ignore; mediapipe's hand/pose landmarker tasks use only plain cv2.
pose      = ["mediapipe>=0.10,<1.0"]
embed     = ["open_clip_torch>=2.24", "torch>=2.0"]
wholebody = ["mmpose>=1.3", "mmcv>=2.1", "mmengine>=0.10", "mmdet>=3.2"]
# RelateAnything (relsgg) -- open-vocabulary relation prediction over the regions
# the `pose` backend already produces. NOT installed by default, for two reasons:
#
# 1. Licence. relsgg's code is Apache-2.0 but its checkpoints are Meta DINOv3
#    derivatives under the DINOv3 License, the strictest weight terms in this
#    pipeline (see backends/relations_relsgg.py and annotations/_meta.json).
# 2. opencv. relsgg depends on opencv-python-headless~=5.0, which installs into
#    the same cv2/ directory as this project's opencv-python -- the exact
#    conflict documented above for the `pose` extra, with the same
#    `libc++abi ... recursive_mutex lock failed` failure mode. Prefer a separate
#    environment; if installing here anyway, repeat the one-distribution cleanup:
#        pip uninstall -y opencv-python-headless opencv-python
#        pip install --force-reinstall --no-deps "opencv-python>=4.8"
#
# relsgg also requires Python >=3.12, narrower than this package's >=3.10, and
# is NOT published on PyPI (pypi.org/pypi/relsgg/json returns 404) -- it installs
# from source only, hence the git URL. huggingface_hub is relsgg's own [hub]
# extra, required by RelateAnything.from_pretrained().
relations = [
    "relsgg @ git+https://github.com/Maelic/RelateAnything.git",
    "huggingface_hub>=1.0",
]
dev       = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
og-annotate = "open_gesture_annotate.cli:console_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["open_gesture_annotate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires real model weights; deselect with -m 'not slow'"]
addopts = "-m 'not slow'"
